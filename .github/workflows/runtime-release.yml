name: runtime-release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated release tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    if: github.repository == 'tompassarelli/wake'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Restore and verify annotated release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --force origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = \
            "$(git rev-parse HEAD^{commit})"

      - name: Verify authored release notes
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          notes_path=".github/release-notes/$RELEASE_TAG.md"
          if [[ ! -s "$notes_path" ]]; then
            echo "::error::missing authored release notes at $notes_path"
            exit 1
          fi
          if [[ "$(sed -n '1p' "$notes_path")" != "# Wake $RELEASE_TAG" ]]; then
            echo "::error::$notes_path must start with # Wake $RELEASE_TAG"
            exit 1
          fi

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.14
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.1'

      - name: Install Bun 1.3.13
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'

      - name: Checkout Beagle
        uses: actions/checkout@v5
        with:
          repository: tompassarelli/beagle
          ref: 987a2d15477670ddb51fd44b50487b52ae9c6343
          path: .beagle

      - name: Link Beagle packages
        run: |
          raco pkg install --auto --link --no-setup \
            .beagle/beagle-lib/ .beagle/beagle-test/ .beagle/beagle/
          echo "$GITHUB_WORKSPACE/.beagle/bin" >> "$GITHUB_PATH"
          echo "_BEAGLE_RACKET=$(which racket)" >> "$GITHUB_ENV"
          echo "BEAGLE_ROOT=$GITHUB_WORKSPACE/.beagle" >> "$GITHUB_ENV"

      - name: Check Beagle sources
        run: .beagle/bin/beagle check --agent web/compiler

      - name: Build compiler and projections
        run: |
          build_dir="$(mktemp -d)"
          web/bin/wake-compile
          web/bin/wake-compile --all web/demo/wiki.bjs "$build_dir"

      - name: Install pinned Wake dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Run Bun runtime and integration tests
        working-directory: web
        run: >-
          bun test
          --bail=1
          runtime/fram-gateway.test.mjs
          runtime/fram-http.test.mjs
          tests/*.test.mjs

      - name: Install Chromium for Playwright
        working-directory: web
        run: bunx --bun --no-install playwright install --with-deps chromium

      - name: Run hermetic browser tests
        working-directory: web
        run: bun run test:browser

  publish:
    needs: verify
    if: github.repository == 'tompassarelli/wake'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Restore and verify annotated release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --force origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = \
            "$(git rev-parse HEAD^{commit})"

      - name: Install Bun 1.3.13
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'

      - name: Verify runtime release packager
        working-directory: web
        run: bun test tests/runtime-package.test.mjs

      - name: Produce exact release twice
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          first="$RUNNER_TEMP/wake-runtime-first"
          second="$RUNNER_TEMP/wake-runtime-second"
          receipt="tompassarelli-wake-runtime-${RELEASE_TAG#v}.receipt.json"
          web/bin/wake-runtime-pack \
            --source-root "$GITHUB_WORKSPACE" \
            --version "$RELEASE_TAG" \
            --output "$first" \
            --receipt "$first/$receipt"
          web/bin/wake-runtime-pack \
            --source-root "$GITHUB_WORKSPACE" \
            --version "$RELEASE_TAG" \
            --output "$second" \
            --receipt "$second/$receipt"
          cmp "$first/tompassarelli-wake-runtime-${RELEASE_TAG#v}.tgz" \
            "$second/tompassarelli-wake-runtime-${RELEASE_TAG#v}.tgz"
          cmp "$first/$receipt" "$second/$receipt"
          mkdir -p "$RUNNER_TEMP/wake-runtime-release"
          cp "$first/tompassarelli-wake-runtime-${RELEASE_TAG#v}.tgz" \
            "$first/$receipt" "$RUNNER_TEMP/wake-runtime-release/"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          "$RUNNER_TEMP/wake-runtime-release/tompassarelli-wake-runtime-${RELEASE_TAG#v}.tgz"
          "$RUNNER_TEMP/wake-runtime-release/tompassarelli-wake-runtime-${RELEASE_TAG#v}.receipt.json"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "Wake $RELEASE_TAG"
          --notes-file ".github/release-notes/$RELEASE_TAG.md"
