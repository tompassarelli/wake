name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.14
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.1'

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout Beagle
        uses: actions/checkout@v5
        with:
          repository: tompassarelli/beagle
          path: .beagle

      - name: Link Beagle packages
        run: |
          raco pkg install --auto --link \
            .beagle/beagle-lib/ .beagle/beagle-test/ .beagle/beagle/
          echo "$GITHUB_WORKSPACE/.beagle/bin" >> "$GITHUB_PATH"
          echo "_BEAGLE_RACKET=$(which racket)" >> "$GITHUB_ENV"
          echo "BEAGLE_ROOT=$GITHUB_WORKSPACE/.beagle" >> "$GITHUB_ENV"

      - name: Check Beagle sources
        run: .beagle/bin/beagle check --agent web/compiler

      - name: Build compiler and projections
        run: |
          build_dir="$(mktemp -d)"
          web/bin/wake-compile
          web/bin/wake-compile --all web/demo/wiki.wake "$build_dir"

      - name: Run Node runtime and integration tests
        working-directory: web
        run: npm test

      - name: Install pinned browser test dependencies
        working-directory: web
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium for Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run hermetic browser tests
        working-directory: web
        run: npm run test:browser
