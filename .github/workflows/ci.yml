name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.14
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.1'

      - name: Install Bun 1.3.13
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'

      - name: Checkout Beagle
        uses: actions/checkout@v5
        with:
          repository: tompassarelli/beagle
          ref: 987a2d15477670ddb51fd44b50487b52ae9c6343
          path: .beagle

      - name: Link Beagle packages
        run: |
          raco pkg install --auto --link --no-setup \
            .beagle/beagle-lib/ .beagle/beagle-test/ .beagle/beagle/
          echo "$GITHUB_WORKSPACE/.beagle/bin" >> "$GITHUB_PATH"
          echo "_BEAGLE_RACKET=$(which racket)" >> "$GITHUB_ENV"
          echo "BEAGLE_ROOT=$GITHUB_WORKSPACE/.beagle" >> "$GITHUB_ENV"

      - name: Check Beagle sources
        run: .beagle/bin/beagle check --agent web/compiler

      - name: Build compiler and projections
        run: |
          build_dir="$(mktemp -d)"
          web/bin/wake-compile
          web/bin/wake-compile --all web/demo/wiki.bjs "$build_dir"

      - name: Install pinned Wake dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Run Bun runtime and integration tests
        working-directory: web
        run: >-
          bun test
          runtime/fram-gateway.test.mjs
          runtime/fram-http.test.mjs
          tests/*.test.mjs

      - name: Install Chromium for Playwright
        working-directory: web
        run: bunx --bun --no-install playwright install --with-deps chromium

      - name: Run hermetic browser tests
        working-directory: web
        run: bun run test:browser
